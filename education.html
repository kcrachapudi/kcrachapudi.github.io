  <style>
    /* ── Cert Cards Grid ── */
    .cert-cards-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 2rem;
    }

    .cert-card {
      background: var(--bg-card);
      border: 0.5px solid var(--border);
      border-top: 2.5px solid var(--accent-mid);
      border-radius: var(--radius-lg);
      padding: 1rem 1.15rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
      color: inherit;
    }
    .cert-card:hover {
      border-color: var(--accent-mid);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .cert-card.linked { cursor: pointer; }

    .cert-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .cert-icon {
      font-size: 22px;
      flex-shrink: 0;
    }
    .cert-link-badge {
      font-size: 10px;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: 10px;
      background: var(--accent);
      color: #e0f8f8;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .cert-card:hover .cert-link-badge {
      background: #0a8080;
    }

    .cert-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 1.35;
    }
    .cert-issuer {
      font-size: 11.5px;
      color: var(--text-secondary);
    }
    .cert-date {
      font-size: 11px;
      color: var(--text-faint);
    }

    /* ── Education Cards ── */
    .edu-cards-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 2rem;
    }

    .edu-card {
      background: var(--bg-card);
      border: 0.5px solid var(--border);
      border-top: 2.5px solid var(--ind-border);
      border-radius: var(--radius-lg);
      padding: 1rem 1.15rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
    }
    .edu-card:hover {
      border-color: var(--border-accent);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .edu-card-top {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .edu-icon {
      font-size: 24px;
      flex-shrink: 0;
    }
    .edu-degree {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 1.35;
      margin-bottom: 2px;
    }
    .edu-school {
      font-size: 12px;
      color: var(--text-secondary);
    }
    .edu-meta {
      font-size: 11px;
      color: var(--text-faint);
    }
    .edu-desc {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    @media (max-width: 680px) {
      .cert-cards-grid { grid-template-columns: repeat(2, 1fr); }
      .edu-cards-grid  { grid-template-columns: 1fr; }
    }
    @media (max-width: 420px) {
      .cert-cards-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
